server:
  port: 8083

spring:
  application:
    name: servicio-publicaciones
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/marketroad_db?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 42MB

jwt:
  secret: ${JWT_SECRET:cambia-este-secreto-en-produccion-minimo-32-caracteres}
