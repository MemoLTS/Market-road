server:
  port: 8081

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-api:8084
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: prod-service
          uri: http://prod-api:8082
          predicates:
            - Path=/api/v1/productos/**, /api/v1/inventario/**

        - id: publication-service
          uri: http://publication-api:8083
          predicates:
            - Path=/api/v1/publicaciones/**, /api/v1/conversaciones/**

      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
