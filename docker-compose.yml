networks:
  marketroad-net:
    driver: bridge

volumes:
  mysql_data:

services:
  # Base de Datos Relacional MySQL
  mysql-db:
    image: mysql:8.0
    container_name: marketroad-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: marketroad_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - marketroad-net

  # Microservicio Usuarios
  user-api:
    build:
      context: ./User-Api
      dockerfile: Dockerfile
    container_name: user-api
    restart: always
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/marketroad_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: cambia-este-secreto-en-produccion-minimo-32-caracteres
    ports:
      - "8084:8084"
    depends_on:
      - mysql-db
    networks:
      - marketroad-net

  # Microservicio Productos e Inventario
  prod-api:
    build:
      context: ./Prod-api
      dockerfile: Dockerfile
    container_name: prod-api
    restart: always
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/marketroad_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
    ports:
      - "8082:8082"
    depends_on:
      - mysql-db
    networks:
      - marketroad-net

  # Microservicio Publicaciones y Mensajería
  publication-api:
    build:
      context: ./Publication-Api
      dockerfile: Dockerfile
    container_name: publication-api
    restart: always
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/marketroad_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: cambia-este-secreto-en-produccion-minimo-32-caracteres
    ports:
      - "8083:8083"
    depends_on:
      - mysql-db
    networks:
      - marketroad-net

  # API Gateway
  gateway-service:
    build:
      context: ./Getaway-Spring
      dockerfile: Dockerfile
    container_name: gateway-service
    restart: always
    environment:
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - user-api
      - prod-api
      - publication-api
    networks:
      - marketroad-net

  # Frontend Web
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketroad-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - gateway-service
    networks:
      - marketroad-net
