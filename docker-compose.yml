networks:
  marketroad-net:
    driver: bridge
volumes:
  mysql_data:
    name: market-road_mysql_data
  mysql_soporte_data:
    name: market-road_mysql_soporte_data
services:
  mysql-db:
    image: mysql:8.0
    container_name: marketroad-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
    - mysql_data:/var/lib/mysql
    ports:
    - 127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --host=127.0.0.1 --user=root
        --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
    - marketroad-net
  mysql-soporte:
    image: mysql:8.0
    container_name: marketroad-soporte-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${SOPORTE_MYSQL_ROOT_PASSWORD:-rootpassword_soporte}
      MYSQL_DATABASE: db_soporte
      MYSQL_USER: ${SOPORTE_DB_USERNAME:-soporte_app}
      MYSQL_PASSWORD: ${SOPORTE_DB_PASSWORD:-soporte_local_dev}
    volumes:
    - mysql_soporte_data:/var/lib/mysql
    - ./soporte/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
    - 127.0.0.1:${SOPORTE_MYSQL_HOST_PORT:-3308}:3306
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --host=127.0.0.1 --user=root
        --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
    - marketroad-net
  database-init:
    image: mysql:8.0
    restart: 'no'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
    - ./database/init.sql:/init.sql:ro
    entrypoint:
    - /bin/sh
    - -c
    command:
    - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --host=mysql-db --user=root < /init.sql
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
    - marketroad-net
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: marketroad-phpmyadmin
    restart: always
    environment:
      PMA_HOSTS: mysql-db,mysql-soporte
      PMA_PORT: 3306
      UPLOAD_LIMIT: 16M
    ports:
    - 127.0.0.1:8085:80
    depends_on:
      mysql-db:
        condition: service_healthy
      mysql-soporte:
        condition: service_healthy
    networks:
    - marketroad-net
  user-api:
    build:
      context: ./User-Api
      dockerfile: Dockerfile
    container_name: user-api
    restart: always
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/db_usuarios?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketroad_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketroad_local_dev}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      JWT_SECRET: cambia-este-secreto-en-produccion-minimo-32-caracteres
      SUPERUSUARIO_CORREO: ${SUPERUSUARIO_CORREO:-admin@marketroad.local}
      SUPERUSUARIO_CONTRASENA: ${SUPERUSUARIO_CONTRASENA:-Admin12345}
    ports:
    - 127.0.0.1:8084:8084
    depends_on:
      database-init:
        condition: service_completed_successfully
    networks:
    - marketroad-net
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '</dev/tcp/127.0.0.1/8084'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
  publication-api:
    build:
      context: ./Publication-Api
      dockerfile: Dockerfile
    container_name: publication-api
    restart: always
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/marketroad_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketroad_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketroad_local_dev}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      JWT_SECRET: cambia-este-secreto-en-produccion-minimo-32-caracteres
    ports:
    - 127.0.0.1:8083:8083
    depends_on:
      database-init:
        condition: service_completed_successfully
    networks:
    - marketroad-net
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '</dev/tcp/127.0.0.1/8083'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
  soporte-api:
    build:
      context: ./soporte
      dockerfile: Dockerfile
    container_name: soporte-api
    restart: always
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-soporte:3306/db_soporte?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SOPORTE_DB_USERNAME:-soporte_app}
      SPRING_DATASOURCE_PASSWORD: ${SOPORTE_DB_PASSWORD:-soporte_local_dev}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      JWT_SECRET: cambia-este-secreto-en-produccion-minimo-32-caracteres
      SOPORTE_JWT_SECRET: ${SOPORTE_JWT_SECRET:-cambia-el-secreto-del-personal-de-soporte-minimo-32}
      SOPORTE_ADMIN_CORREO: ${SOPORTE_ADMIN_CORREO:-soporte-admin@marketroad.local}
      SOPORTE_ADMIN_CONTRASENA: ${SOPORTE_ADMIN_CONTRASENA:-Soporte12345}
      SOPORTE_AGENTE_CORREO: ${SOPORTE_AGENTE_CORREO:-soporte@marketroad.local}
      SOPORTE_AGENTE_CONTRASENA: ${SOPORTE_AGENTE_CONTRASENA:-Agente12345}
    ports:
    - 127.0.0.1:8086:8086
    depends_on:
      mysql-soporte:
        condition: service_healthy
    networks:
    - marketroad-net
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '</dev/tcp/127.0.0.1/8086'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
  gateway-service:
    build:
      context: ./Getaway-Spring
      dockerfile: Dockerfile
    container_name: gateway-service
    restart: always
    environment:
      SERVER_PORT: 8081
    ports:
    - 127.0.0.1:8081:8081
    depends_on:
      user-api:
        condition: service_healthy
      publication-api:
        condition: service_healthy
      soporte-api:
        condition: service_healthy
    networks:
    - marketroad-net
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '</dev/tcp/127.0.0.1/8081'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketroad-frontend
    restart: always
    ports:
    - 127.0.0.1:8080:80
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
    - marketroad-net
