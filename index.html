<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market-Rode</title>
    <!-- Carga de Bootstrap y Bootstrap Icons desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="home-page">
    <!-- Header con Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom border-gray">
        <div class="container-lg">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-shop"></i> Market-Road
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#inicio">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#productos">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#servicios">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contacto">Contacto</a>
                    </li>
                </ul>
                <button class="btn btn-primary ms-lg-3" type="button" data-bs-toggle="modal"
                    data-bs-target="#modalRegistro">
                    Registrarse
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal con borde gris -->
    <div class="container-lg border-start border-end border-2 border-gray-light"
        style="min-height: calc(100vh - 70px);">
        <!-- Contenido principal aquí -->
    </div>

    <!-- Modal de registro de usuario -->
    <div class="modal fade" id="modalRegistro" tabindex="-1" aria-labelledby="modalRegistroLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formRegistro">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalRegistroLabel">Crear cuenta</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div id="registroAlerta" class="alert d-none" role="alert"></div>

                        <div class="mb-3">
                            <label for="regNombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="regNombre" required minlength="3"
                                maxlength="32">
                        </div>
                        <div class="mb-3">
                            <label for="regApellido" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="regApellido" required minlength="3"
                                maxlength="32">
                        </div>
                        <div class="mb-3">
                            <label for="regApodo" class="form-label">Apodo</label>
                            <input type="text" class="form-control" id="regApodo" required minlength="3" maxlength="20">
                        </div>
                        <div class="mb-3">
                            <label for="regCorreo" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="regCorreo" required>
                        </div>
                        <div class="mb-3">
                            <label for="regContrasena" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="regContrasena" required minlength="8"
                                maxlength="32">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnRegistrar">Crear cuenta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/catalogo.js"></script>
    <script type="module" src="js/usuarios.js"></script>
</body>

</html>
