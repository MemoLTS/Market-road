<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market-Road</title>
    <!-- Carga de Bootstrap y Bootstrap Icons desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="home-page">
    <!-- Header con Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom border-gray">
        <div class="container-lg">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-shop"></i> Market-Road
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#inicio">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#productos">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#servicios">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contacto">Contacto</a>
                    </li>
                </ul>
                <button class="btn btn-primary ms-lg-3" type="button" data-bs-toggle="modal"
                    data-bs-target="#modalRegistro">
                    Registrarse
                </button>
            </div>
        </div>
    </nav>

    <main class="marketplace-main" id="inicio">
        <section class="marketplace-intro" aria-labelledby="marketplace-title">
            <div>
                <p class="marketplace-eyebrow">Market-Road <span>·</span> compra cerca</p>
                <h1 id="marketplace-title">Algo bueno te espera a la vuelta.</h1>
                <p class="marketplace-lede">Encuentra objetos únicos de personas cerca de ti.</p>
            </div>
            <label class="marketplace-search">
                <i class="bi bi-search" aria-hidden="true"></i>
                <span class="visually-hidden">Buscar publicaciones</span>
                <input id="input-busqueda" type="search" placeholder="¿Qué estás buscando?">
            </label>
        </section>

        <section class="marketplace-listings" id="productos" aria-labelledby="listings-title">
            <div class="listings-heading">
                <div>
                    <p class="marketplace-eyebrow">Lo que hay cerca</p>
                    <h2 id="listings-title">Publicaciones recientes</h2>
                </div>
                <button class="create-listing-button" type="button" data-bs-toggle="modal"
                    data-bs-target="#modalRegistro">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i>
                    Crear publicación
                </button>
            </div>
            <div id="contenedor-productos" class="marketplace-grid" aria-live="polite"></div>
        </section>
    </main>

    <div class="modal fade" id="modalDetallePublicacion" tabindex="-1" aria-labelledby="detalleTitulo"
        aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content listing-detail">
                <div class="modal-header">
                    <span class="detail-category" id="detalleCategoria"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <img class="detail-image" id="detalleImagen" src="" alt="">
                    <div class="detail-copy">
                        <h2 id="detalleTitulo"></h2>
                        <p class="detail-price" id="detallePrecio"></p>
                        <p class="detail-description" id="detalleDescripcion"></p>
                        <dl class="detail-facts">
                            <div>
                                <dt><i class="bi bi-geo-alt" aria-hidden="true"></i> Distancia</dt>
                                <dd id="detalleDistancia"></dd>
                            </div>
                            <div>
                                <dt><i class="bi bi-pin-map" aria-hidden="true"></i> Zona</dt>
                                <dd id="detalleUbicacion"></dd>
                            </div>
                            <div>
                                <dt><i class="bi bi-person" aria-hidden="true"></i> Vendedor</dt>
                                <dd id="detalleVendedor"></dd>
                            </div>
                        </dl>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="create-listing-button" data-bs-dismiss="modal" data-bs-toggle="modal"
                        data-bs-target="#modalRegistro">
                        <i class="bi bi-plus-lg" aria-hidden="true"></i>
                        Crear publicación
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de registro de usuario -->
    <div class="modal fade" id="modalRegistro" tabindex="-1" aria-labelledby="modalRegistroLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formRegistro">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalRegistroLabel">Crear cuenta</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div id="registroAlerta" class="alert d-none" role="alert"></div>

                        <div class="mb-3">
                            <label for="regNombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="regNombre" required minlength="3"
                                maxlength="32">
                        </div>
                        <div class="mb-3">
                            <label for="regApellido" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="regApellido" required minlength="3"
                                maxlength="32">
                        </div>
                        <div class="mb-3">
                            <label for="regApodo" class="form-label">Apodo</label>
                            <input type="text" class="form-control" id="regApodo" required minlength="3" maxlength="20">
                        </div>
                        <div class="mb-3">
                            <label for="regCorreo" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="regCorreo" required>
                        </div>
                        <div class="mb-3">
                            <label for="regContrasena" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="regContrasena" required minlength="8"
                                maxlength="32">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnRegistrar">Crear cuenta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/catalogo.js"></script>
    <script type="module" src="js/usuarios.js"></script>
</body>

</html>
